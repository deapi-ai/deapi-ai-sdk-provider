name: Release (npm trusted publishing)

# Governed, attested publish path for @deapi/ai-sdk-provider (PLAN P0.8).
#
# This is the ONLY supported way to publish — never `npm publish` from a laptop.
# package.json sets publishConfig.provenance=true, which REQUIRES publishing from
# a CI workflow with OIDC (id-token: write). Provenance attestations cannot be
# generated from a local machine.
#
# Triggers:
#   - push of a version tag `v*.*.*` (e.g. v0.1.0)  -> full gate + PUBLISH, OR
#   - manual workflow_dispatch                       -> PREFLIGHT/DRY-RUN ONLY.
#
# Safety (Audit Blocker-5/6):
#   - PUBLISH happens ONLY when github.ref starts with 'refs/tags/v'. A manual
#     workflow_dispatch can never publish — it runs the verify gate as a
#     dry-run/preflight and stops.
#   - A dedicated step asserts the pushed tag `vX.Y.Z` matches
#     package.json.version, failing the release on any mismatch.
#   - Runs the full pre-publish gate (typecheck, lint, coverage, build, pack
#     audit, consumer smoke) BEFORE publishing.
#   - Publishes from a protected GitHub Environment (`release`) so a human must
#     approve the run (configure required reviewers on the environment in repo
#     Settings -> Environments).
#   - Uses npm trusted publishing (OIDC). No NODE_AUTH_TOKEN / .npmrc secret.
#     npm is PINNED to an explicit version that supports OIDC trusted publishing
#     (never `@latest`).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual runs are preflight/dry-run ONLY and never publish.'
        required: true
        default: 'preflight'
        type: choice
        options:
          - preflight

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 1: run the full pre-publish gate with no elevated permissions.
  verify:
    name: pre-publish gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate tag matches package.json version
        # Only meaningful for tag pushes. On workflow_dispatch (no tag) this is
        # skipped — manual runs are preflight-only and never publish.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v0.1.0
          TAG_VERSION="${TAG#v}"             # strip leading v -> 0.1.0
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=${TAG} tagVersion=${TAG_VERSION} packageVersion=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "ERROR: tag '${TAG}' (version '${TAG_VERSION}') does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          echo "OK: tag matches package.json version."

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Pack allowlist audit
        run: node scripts/pack-audit.mjs

      - name: Consumer smoke (tarball install + ESM/CJS import + typecheck + mock request)
        run: node scripts/consumer-smoke.mjs

  # Stage 2: publish with OIDC from a protected environment requiring approval.
  # GUARD (Audit Blocker-5): this job runs ONLY for tag pushes (refs/tags/v*).
  # A manual workflow_dispatch fails this `if` and the job is skipped, so manual
  # runs are preflight/dry-run only and can never publish.
  publish:
    name: publish to npm (provenance)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v0.1.0
          TAG_VERSION="${TAG#v}"             # strip leading v -> 0.1.0
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=${TAG} tagVersion=${TAG_VERSION} packageVersion=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "ERROR: tag '${TAG}' (version '${TAG_VERSION}') does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          echo "OK: tag matches package.json version."

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pin npm to a version that supports trusted publishing
        # npm trusted publishing (OIDC) + --provenance requires npm >= 11.5.1.
        # The npm bundled with actions/setup-node (Node 20/22) is 10.x, too old.
        # Pin an EXPLICIT version (never @latest) for a reproducible toolchain.
        run: npm install -g npm@11.6.2

      - name: Publish (provenance, trusted publishing via OIDC)
        # No NODE_AUTH_TOKEN: npm uses the OIDC id-token for trusted publishing.
        # publishConfig in package.json sets access=public and provenance=true.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"

      - name: Verify published version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for npm to reflect version ${PKG_VERSION}..."
          for i in $(seq 1 10); do
            PUBLISHED=$(npm view @deapi/ai-sdk-provider version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
              echo "Confirmed @deapi/ai-sdk-provider@${PUBLISHED} on npm."
              exit 0
            fi
            echo "  attempt $i: registry reports '${PUBLISHED}', expected '${PKG_VERSION}' — retrying in 15s"
            sleep 15
          done
          echo "ERROR: npm did not report version ${PKG_VERSION} after publish."
          exit 1
